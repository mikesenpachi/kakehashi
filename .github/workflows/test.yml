# Run the webapp unit tests on Linux, macOS and Windows.
# The tests use a temporary data folder and a fake OCR, so they need no network or Google calls.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kakehashi-web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # this action has no major tag (no v10)
        with:
          enable-cache: true
          cache-dependency-glob: kakehashi-web/uv.lock
      - run: uv run pytest
