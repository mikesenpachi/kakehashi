[project]
name = "kakehashi-web"
version = "0.1.0"
description = "kakehashi desktop webapp: receives screenshots, runs OCR"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "chrome-lens-py>=3.5.3",
    "fastapi>=0.143.0",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
